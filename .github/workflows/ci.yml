name: CI

on:
  push:
    branches: ['**']

# The workflow only needs to read the repository; nothing it runs may write to it.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Tests use Testcontainers (Redis and Postgres); Docker is preinstalled on ubuntu-latest.
      - name: Run tests
        run: ./mvnw -B verify
