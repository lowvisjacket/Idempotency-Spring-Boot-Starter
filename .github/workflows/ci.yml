name: CI

on:
  push:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Tests use Testcontainers (Redis and Postgres); Docker is preinstalled on ubuntu-latest.
      - name: Run tests
        run: ./mvnw -B verify
